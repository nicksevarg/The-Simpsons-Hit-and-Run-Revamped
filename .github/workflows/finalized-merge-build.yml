name: Finalized Merge w/ Build [v1.02]
run-name: "Finalized Merge w/ Build [v1.02]"

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/workflows/**'
      - 'icon-source/**'
      - 'tools/generate_adaptive_icon.py'
      - 'README*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Finalized Merge w/ Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android build dependencies
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;4.1.2" "ndk;28.2.13676358"

      - name: Set up Python icon tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/icon-venv"
          "$RUNNER_TEMP/icon-venv/bin/python" -m pip install --upgrade pip Pillow

      - name: Sync final icon layers and recover missing generation inputs
        run: |
          set -euo pipefail
          mkdir -p icon-source tools
          git fetch --no-tags --depth=1 origin master

          # The root PNGs are temporary staging files. Import them only when
          # all three are present; otherwise use the committed source layers.
          source_paths=(final-icons-background.png final-icons-foreground.png final-icons-monochrome.png)
          present=0
          for path in "${source_paths[@]}"; do
            if git cat-file -e "FETCH_HEAD:${path}" 2>/dev/null; then
              present=$((present + 1))
            fi
          done
          if [[ "$present" -eq 3 ]]; then
            git show FETCH_HEAD:final-icons-background.png > icon-source/background.png
            git show FETCH_HEAD:final-icons-foreground.png > icon-source/foreground.png
            git show FETCH_HEAD:final-icons-monochrome.png > icon-source/monochrome.png
            echo "Imported all three staged icon layers from master."
          elif [[ "$present" -eq 0 ]]; then
            echo "No root staging PNGs remain; using committed icon-source layers when available."
          else
            echo "Incomplete icon staging set on master ($present of 3 files); refusing to build with mixed artwork." >&2
            exit 1
          fi

          # The new repository must be self-contained: do not depend on
          # an unauthenticated fetch from the old repository at build time.
          required_inputs=(
            icon-source/background.png
            icon-source/foreground.png
            icon-source/monochrome.png
            tools/generate_adaptive_icon.py
          )
          for path in "${required_inputs[@]}"; do
            if [[ ! -s "$path" ]]; then
              echo "Required build input is missing from this repository: $path" >&2
              exit 1
            fi
          done
          echo "All icon source layers and the generator are present in this repository."

          "$RUNNER_TEMP/icon-venv/bin/python" - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("icon-source")
          required = ("background.png", "foreground.png", "monochrome.png")
          for name in required:
              path = source / name
              with Image.open(path) as image:
                  image.load()
                  if image.format != "PNG":
                      raise SystemExit(f"{name}: expected PNG, got {image.format}")
                  if image.width != image.height:
                      raise SystemExit(f"{name}: expected a square layer, got {image.size}")
                  if image.width < 1024:
                      raise SystemExit(f"{name}: expected at least 1024px, got {image.size}")
                  if name != "background.png" and "A" not in image.getbands():
                      raise SystemExit(f"{name}: expected alpha channel for adaptive icon transparency")
                  print(f"Validated {name}: {image.width}x{image.height}, mode={image.mode}")
          PY

      - name: Commit refreshed source icon layers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-source/background.png icon-source/foreground.png icon-source/monochrome.png tools/generate_adaptive_icon.py
          if git diff --cached --quiet; then
            echo "The master icon layers are already synced."
          else
            git commit -m "Update final adaptive Android icon artwork"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Generate launcher icon layers and previews with established 77.5% scaling
        run: |
          "$RUNNER_TEMP/icon-venv/bin/python" tools/generate_adaptive_icon.py

      - name: Cache FFmpeg Prefab Maven repository
        id: ffmpeg-prefab-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ffmpeg-prefab-2023.08.14.00.12-${{ runner.os }}

      - name: Install FFmpeg Prefab dependency
        if: steps.ffmpeg-prefab-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.m2/repository"
          curl --fail --location --retry 8 --retry-all-errors --retry-max-time 600 \
            --connect-timeout 30 --max-time 900 \
            --output /tmp/ffmpeg-prefab.tar.xz \
            "https://github.com/leleliu008/ndk-pkg-prefab-aar-maven-repo/releases/download/2023.08.14.00.12/2023.08.14.00.12-com-fpliu-ndk-pkg-prefab-android-21-ffmpeg-6.0.tar.xz"
          tar -xJf /tmp/ffmpeg-prefab.tar.xz --strip-components=1 -C "$HOME/.m2/repository"

      - name: Use checksum-verified Gradle distribution mirror
        run: |
          python3 - <<'PY'
          from pathlib import Path

          wrapper = Path("android-project/gradle/wrapper/gradle-wrapper.properties")
          content = wrapper.read_text()
          old = r"distributionUrl=https\://services.gradle.org/distributions/gradle-8.12-bin.zip"
          new = r"distributionUrl=https\://repo.huaweicloud.com/gradle/gradle-8.12-bin.zip"
          if old not in content:
              raise SystemExit("Expected Gradle 8.12 wrapper URL was not found; refusing to modify an unexpected wrapper.")
          content = content.replace(old, new, 1)

          checksum = "distributionSha256Sum=7a00d51fb93147819aab76024feece20b6b84e420694101f276be952e08bef03"
          existing_checksums = [line for line in content.splitlines() if line.startswith("distributionSha256Sum=")]
          if existing_checksums and existing_checksums != [checksum]:
              raise SystemExit(f"Unexpected Gradle distribution checksum already exists: {existing_checksums}")
          if not existing_checksums:
              content = content.rstrip() + "\n" + checksum + "\n"

          wrapper.write_text(content)
          print(f"Configured verified Gradle distribution mirror: {new}")
          print(f"Configured Gradle distribution checksum: {checksum}")

          PY

      - name: Cache Gradle 8.12 wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-8.12-huawei-verified

      - name: Build release APK
        working-directory: android-project
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Sign release APK
        working-directory: android-project
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -keypass android \
            -alias androidrelease \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Simpsons Hit and Run Android, OU=Build, O=Community, C=US"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/app-release.apk \
            "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          rm -f "$APK"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Simpsons-HR-Revamped-Finalized-Merge-APK
          path: android-project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload adaptive icon previews
        uses: actions/upload-artifact@v4
        with:
          name: Simpsons-HR-Revamped-Finalized-Merge-Icon-Previews
          path: |
            adaptive-icon-preview.png
            adaptive-icon-preview-round.png
          if-no-files-found: error
          retention-days: 30
