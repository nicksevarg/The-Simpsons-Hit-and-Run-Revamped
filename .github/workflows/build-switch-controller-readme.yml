name: Build Simpsons H&R Switch Controller + README Baseline APK

on:
  push:
    branches:
      - final-baseline-switch-layout-readme
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android build dependencies
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;4.1.2" "ndk;28.2.13676358"

      - name: Set up Python icon tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/icon-venv"
          "$RUNNER_TEMP/icon-venv/bin/python" -m pip install --upgrade pip Pillow

      - name: Sync final icon layers and recover missing generation inputs
        run: |
          set -euo pipefail
          mkdir -p icon-source tools
          git fetch --no-tags --depth=1 origin master

          # The root PNGs are temporary staging files. Import them only when
          # all three are present; otherwise use the committed source layers.
          source_paths=(final-icons-background.png final-icons-foreground.png final-icons-monochrome.png)
          present=0
          for path in "${source_paths[@]}"; do
            if git cat-file -e "FETCH_HEAD:${path}" 2>/dev/null; then
              present=$((present + 1))
            fi
          done
          if [[ "$present" -eq 3 ]]; then
            git show FETCH_HEAD:final-icons-background.png > icon-source/background.png
            git show FETCH_HEAD:final-icons-foreground.png > icon-source/foreground.png
            git show FETCH_HEAD:final-icons-monochrome.png > icon-source/monochrome.png
            echo "Imported all three staged icon layers from master."
          elif [[ "$present" -eq 0 ]]; then
            echo "No root staging PNGs remain; using committed icon-source layers when available."
          else
            echo "Incomplete icon staging set on master ($present of 3 files); refusing to build with mixed artwork." >&2
            exit 1
          fi

          # Restore the missing assets and generator from the source branch
          # when this repository copy does not already contain them.
          if [[ ! -s icon-source/background.png || ! -s icon-source/foreground.png || ! -s icon-source/monochrome.png || ! -s tools/generate_adaptive_icon.py ]]; then
            git fetch --no-tags --depth=1 https://github.com/hidinginthefireplace/The-Simpsons-Hit-and-Run-Android.git final-baseline-switch-layout-readme
            git show FETCH_HEAD:icon-source/background.png > icon-source/background.png
            git show FETCH_HEAD:icon-source/foreground.png > icon-source/foreground.png
            git show FETCH_HEAD:icon-source/monochrome.png > icon-source/monochrome.png
            git show FETCH_HEAD:tools/generate_adaptive_icon.py > tools/generate_adaptive_icon.py
          fi

          "$RUNNER_TEMP/icon-venv/bin/python" - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("icon-source")
          required = ("background.png", "foreground.png", "monochrome.png")
          for name in required:
              path = source / name
              with Image.open(path) as image:
                  image.load()
                  if image.format != "PNG":
                      raise SystemExit(f"{name}: expected PNG, got {image.format}")
                  if image.width != image.height:
                      raise SystemExit(f"{name}: expected a square layer, got {image.size}")
                  if image.width < 1024:
                      raise SystemExit(f"{name}: expected at least 1024px, got {image.size}")
                  if name != "background.png" and "A" not in image.getbands():
                      raise SystemExit(f"{name}: expected alpha channel for adaptive icon transparency")
                  print(f"Validated {name}: {image.width}x{image.height}, mode={image.mode}")
          PY

      - name: Commit refreshed source icon layers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-source/background.png icon-source/foreground.png icon-source/monochrome.png tools/generate_adaptive_icon.py
          if git diff --cached --quiet; then
            echo "The master icon layers are already synced."
          else
            git commit -m "Update final adaptive Android icon artwork"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Generate launcher icon layers and previews with established 77.5% scaling
        run: |
          "$RUNNER_TEMP/icon-venv/bin/python" tools/generate_adaptive_icon.py

      - name: Install FFmpeg Prefab dependency
        run: |
          mkdir -p "$HOME/.m2/repository"
          curl -fL --retry 3 -o /tmp/ffmpeg-prefab.tar.xz "https://github.com/leleliu008/ndk-pkg-prefab-aar-maven-repo/releases/download/2023.08.14.00.12/2023.08.14.00.12-com-fpliu-ndk-pkg-prefab-android-21-ffmpeg-6.0.tar.xz"
          tar -xJf /tmp/ffmpeg-prefab.tar.xz --strip-components=1 -C "$HOME/.m2/repository"

      - name: Build release APK
        working-directory: android-project
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Sign release APK
        working-directory: android-project
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -keypass android \
            -alias androidrelease \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Simpsons Hit and Run Android, OU=Build, O=Community, C=US"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/app-release.apk \
            "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          rm -f "$APK"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Simpsons-HR-Revamped-Switch-Controller-README-Baseline
          path: android-project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload adaptive icon previews
        uses: actions/upload-artifact@v4
        with:
          name: Simpsons-HR-Revamped-Crisp-Adaptive-Icon-Previews
          path: |
            adaptive-icon-preview.png
            adaptive-icon-preview-round.png
          if-no-files-found: error
          retention-days: 30
